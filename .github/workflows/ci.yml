name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check syntax
        run: for f in tmux-plugin-panel.tmux scripts/*.sh; do bash -n "$f"; done
      - name: Run shellcheck
        run: shellcheck -x tmux-plugin-panel.tmux scripts/*.sh test/*.bash test/*.bats

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tests copy TPM into their temporary plugin directories. The panel
      # sources TPM's helpers and runs its scripts, so TPM is pinned: a change
      # upstream then cannot alter what the suite exercises without a
      # deliberate bump here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: tmux-plugins/tpm
          ref: e261deb1b47614eed3400089ce7197dc68acc4eb
          path: .tpm
      - name: Install tmux, fzf and bats
        run: sudo apt-get update && sudo apt-get install -y tmux fzf bats
      - name: Run tests
        env:
          TPM_SRC: ${{ github.workspace }}/.tpm
        run: bats test/
