name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check syntax
        run: for f in tmux-plugin-panel.tmux scripts/*.sh; do bash -n "$f"; done
      - name: Run shellcheck
        run: shellcheck -x tmux-plugin-panel.tmux scripts/*.sh test/*.bash test/*.bats

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The tests copy TPM into their temporary plugin directories. Pinned to
      # the commit the suite was written against.
      - uses: actions/checkout@v7
        with:
          repository: tmux-plugins/tpm
          ref: e261deb1b47614eed3400089ce7197dc68acc4eb
          path: .tpm
      - name: Install tmux, fzf and bats
        run: sudo apt-get update && sudo apt-get install -y tmux fzf bats
      - name: Run tests
        env:
          TPM_SRC: ${{ github.workspace }}/.tpm
        run: bats test/
